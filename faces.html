<style>
:root { --bg: #111; --card: #191919; --text: #eee; --muted: #8a8a8a; --line: #262626; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, "Helvetica Neue", sans-serif; }
header { max-width: 1600px; margin: 0 auto; padding: 32px 24px 0; }
.title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--muted); }
.toolbar { position: sticky; top: 0; z-index: 5; background: rgba(17, 17, 17, 0.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.toolbar > div { max-width: 1600px; margin: 0 auto; padding: 14px 24px; display: flex; gap: 10px; align-items: center; }
.field { position: relative; display: flex; align-items: center; min-width: 0; }
.field > svg { position: absolute; left: 11px; color: var(--muted); pointer-events: none; }
.field.search-field { flex: 1 1 auto; }
.field.device-field { flex: 0 1 300px; }
.field.device-field > svg.chev { left: auto; right: 11px; }
.combo-clear { position: absolute; right: 30px; width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; }
.combo-clear:hover { background: #2a2a2a; color: var(--text); }
.combo-list { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 10; margin: 0; padding: 6px; list-style: none; max-height: min(360px, 60vh); overflow-y: auto; background: #1c1c1c; border: 1px solid #333; border-radius: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, .5); }
.combo-list li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.combo-list li span { overflow: hidden; text-overflow: ellipsis; }
.combo-list li small { color: var(--muted); }
.combo-list li[aria-selected="true"] { color: #fff; font-weight: 600; }
.combo-list li.active { background: #2b2b2b; }
.combo-list li.none { color: var(--muted); cursor: default; }
.search, .device-filter { height: 38px; width: 100%; background: var(--card); color: var(--text); border: 1px solid #2e2e2e; border-radius: 10px; padding: 0 12px 0 34px; font: inherit; transition: border-color .15s; }
.device-filter { padding-right: 56px; text-overflow: ellipsis; }
.search:hover, .device-filter:hover { border-color: #444; }
.search:focus, .device-filter:focus { outline: none; border-color: #777; }
.dl-filter { width: 100%; box-sizing: border-box; margin-top: 8px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; }
main { max-width: 1600px; margin: 0 auto; padding: 4px 24px 48px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 14px; }
.face[hidden] { display: none; }
.face { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.face h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.face h2 small { color: var(--muted); font-weight: 400; }
.pair { display: flex; gap: 8px; }
.board { flex: 1; min-width: 0; text-align: center; color: var(--muted); font-size: 11px; }
.screen { width: 100%; aspect-ratio: 1; position: relative; }
.screen > .inner { position: absolute; left: 0; top: 0; width: 390px; height: 390px; transform-origin: 0 0; }
.swatches { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 11px; color: var(--muted); }
.swatches > span { min-width: 64px; }
.swatches > div { display: flex; gap: 6px; flex-wrap: wrap; }
.settings { font-size: 12px; color: var(--muted); }
.face-foot { margin-top: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.settings-btn { background: var(--card); color: var(--text); border: 1px solid #3a3a3a; border-radius: 8px; padding: 4px 10px; font: inherit; cursor: pointer; }
.settings-btn:hover { border-color: #777; }
.settings-dialog { box-sizing: border-box; width: min(920px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow-x: hidden; overflow-wrap: anywhere; background: #161616; color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.settings-dialog::backdrop { background: rgba(0,0,0,.6); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dlg-head h2 { margin: 0; font-size: 17px; }
.dlg-close { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 14px; }
.dlg-sub { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.dlg-body { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; margin-top: 16px; align-items: start; }
.dlg-preview .screen { width: 300px; }
.settings-dialog .settings { margin: 0; border: 0; padding: 0; }

.settings h3 { margin: 12px 0 4px; font-size: 12px; color: var(--text); font-weight: 600; }
.settings dl { margin: 0; display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr); gap: 6px 10px; }
.settings dt { color: var(--text); }
.settings dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.settings .more { width: 100%; }
.settings .more > summary { cursor: pointer; }
.settings .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip.on { border-color: #888; color: var(--text); }
.chip.play { background: none; color: var(--muted); font: inherit; cursor: pointer; }
.chip.play:hover { border-color: #666; color: var(--text); }
.chip.play.on { border-color: #ddd; color: var(--text); background: #2a2a2a; }
.settings .note { margin: 10px 0 0; }
.swatches button { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatches button[aria-pressed="true"] { border-color: #fff; }
.dl-list { display: grid; gap: 8px; margin-top: 14px; }
.dl-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); text-decoration: none; background: #1d1d1d; }
.dl-item:hover { border-color: #777; }
.dl-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.dl-text span { color: var(--muted); font-size: 12px; }
.dl-item code { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%; }
.dlg-dl { flex: none; margin-top: 10px; }
.dl-devices { margin-top: 14px; font-size: 12px; color: var(--muted); }
.dl-devices > summary { cursor: pointer; }
.dl-devices .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
@media (max-width: 480px) { .dl-item code { display: none; } }
.card-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--card); color: var(--text); border: 1px solid #3a3a3a; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; text-decoration: none; }
.card-btn:hover { border-color: #777; }
.dlg-files { margin: 8px 0 0; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 12px; }
.dlg-files a { color: #8fc2ff; }
.empty { grid-column: 1 / -1; color: var(--muted); padding: 24px 0; text-align: center; }
@media (max-width: 680px) { .dlg-body { grid-template-columns: minmax(0, 1fr); } .dlg-preview .screen { width: min(260px, 100%); margin: 0 auto; } .settings-dialog { padding: 14px; } }
@media (max-width: 480px) { .settings dl { grid-template-columns: minmax(0, 1fr); gap: 2px; } .settings dd { margin-bottom: 8px; } header { padding: 20px 12px 0; } .toolbar > div { padding: 12px; } main { padding: 4px 12px 32px; } }
@media (max-width: 640px) { .toolbar > div { flex-wrap: wrap; } .field.search-field { flex: 1 1 100%; } .field.device-field { flex: 1 1 0; } }
</style>
</head>

// Swatch rows bound to a face's state: the face's real color settings, applied to the mockup.

// Devices a face supports (faces/<Dir>/face.json); all faces together for the header popup.
const DEVICE_NAME = Object.fromEntries(DEVICES.map(d => [d.id, d.name]));
function faceDevices(face) {
  const ids = face ? (face.devices || DEVICES.map(d => d.id))

const deviceInput = document.getElementById('device');
let deviceId = '';                    // picked watch ('' = all)
const pickedDevice = () => deviceId;
// Download popup: pick a file from the latest release.
const DL = RELEASES.replace(/\/latest$/, '/latest/download/');
function openDownload(face) {

    ['All devices', 'Connect IQ Store / private beta package', dir + '.iq'],
    ['Everything', 'Folder ' + dir + '/ with all three files', dir + '.zip'],

const inners = [];

const empty = el('p', 'empty', 'No faces match.');
empty.hidden = true;
grid.appendChild(empty);
const fold = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();   // fēnix -> fenix
// Watch filter: a searchable combobox (type to narrow the list, arrows + Enter, Esc to close).
const deviceList = document.getElementById('device-list'), deviceClear = document.getElementById('device-clear');
const allDevices = faceDevices(null).map(d => ({...d, n: faces.filter(f => faceDevices(f).some(x => x.id === d.id)).length,
                                                q: fold(d.name + ' ' + d.id)}));
let comboItems = [], comboActive = 0;
function comboOpen() {
  const q = fold((deviceInput.value === nameOf(deviceId) ? '' : deviceInput.value).trim()).split(/\s+/).filter(Boolean);
  comboItems = [{id: '', name: 'All watches', n: faces.length}].filter(() => !q.length)

function comboMark(i) {

deviceInput.addEventListener('focus', () => { deviceInput.select(); comboOpen(); });
