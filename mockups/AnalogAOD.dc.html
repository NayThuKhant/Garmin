<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch face E: Always-on mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#1a1a1a}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 390px; border-radius: 50%; background: #000000; overflow: hidden; font-family: 'Barlow', 'Helvetica Neue', sans-serif; color: #8a8a8a">
<svg width="390" height="390" viewBox="0 0 390 390" fill="none" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="{{majorTicks}}" stroke="#6a6a6a" stroke-width="3" stroke-linecap="round"></path>
</svg>
<div style="position: absolute; left: 0; top: 78px; width: 390px; display: flex; justify-content: center; font-size: 14px; font-weight: 500; letter-spacing: 2px">MON 05</div>
<div style="position: absolute; left: 0; top: 284px; width: 390px; display: flex; justify-content: center; gap: 16px; font-size: 14px; font-weight: 500">
<span>HR 62</span><span>BB 68</span>
</div>
<svg width="390" height="390" viewBox="0 0 390 390" fill="none" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<line x1="195" y1="195" x2="{{hourX}}" y2="{{hourY}}" stroke="#b0b0b0" stroke-width="6" stroke-linecap="round"></line>
<line x1="195" y1="195" x2="{{minX}}" y2="{{minY}}" stroke="#b0b0b0" stroke-width="3" stroke-linecap="round"></line>
<circle cx="195" cy="195" r="5" fill="#b0b0b0"></circle>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    function pt(r, deg) {
      var a = deg * Math.PI / 180;
      return [195 + r * Math.sin(a), 195 - r * Math.cos(a)];
    }
    function f(n) { return Math.round(n * 10) / 10; }
    var major = '';
    for (var i = 0; i < 12; i++) {
      var p1 = pt(186, i * 30), p2 = pt(170, i * 30);
      major += 'M' + f(p1[0]) + ' ' + f(p1[1]) + ' L' + f(p2[0]) + ' ' + f(p2[1]) + ' ';
    }
    var h = pt(92, 304), m = pt(148, 52.2);
    return { majorTicks: major, hourX: f(h[0]), hourY: f(h[1]), minX: f(m[0]), minY: f(m[1]) };
  }
}
</script>
</body>
</html>
