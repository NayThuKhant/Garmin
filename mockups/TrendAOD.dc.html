<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch face F: Always-on mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&amp;family=Barlow:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#1a1a1a}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 390px; border-radius: 50%; background: #000000; overflow: hidden; font-family: 'Barlow', 'Helvetica Neue', sans-serif; color: #a8a8a8">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 390px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<div style="font-size: 14px; font-weight: 500; letter-spacing: 1.5px; color: #8a8a8a">MON 05 OCT · 28°</div>
<div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 500; font-size: 88px; line-height: 0.95; letter-spacing: -1px">10:08</div>
<svg width="180" height="28" viewBox="0 0 212 40" fill="none" aria-hidden="true">
<path d="{{spark}}" stroke="#7a7a7a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
</svg>
<div style="display: flex; gap: 16px; font-size: 15px; font-weight: 500; color: #8a8a8a">
<span>HR 62</span><span>7,412</span><span>BB 68</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    var hr = [58, 57, 60, 64, 72, 88, 104, 118, 112, 96, 80, 72, 68, 66, 64, 70, 74, 68, 64, 62, 61, 63, 62, 62];
    var lo = 50, hi = 122, w = 212, h = 40;
    var pts = hr.map(function (v, i) {
      var x = Math.round((i / (hr.length - 1)) * (w - 4) * 10) / 10 + 2;
      var y = Math.round((h - 3 - ((v - lo) / (hi - lo)) * (h - 6)) * 10) / 10;
      return x + ' ' + y;
    });
    return { spark: 'M' + pts.join(' L') };
  }
}
</script>
</body>
</html>
