<div style="display: flex; flex-direction: column; width: 268px; margin-top: 6px; gap: 2px">

<span style="font-size: 11px; font-weight: 600; color: #8a8a8a">54–118</span>

<div style="display: flex; align-items: center; gap: 8px">
<svg width="212" height="40" viewBox="0 0 212 40" fill="none" aria-hidden="true">

<div style="display: flex; flex-direction: column; align-items: center; padding: 5px 0; border-radius: 10px; background: #141414">
<span style="font-size: 17px; font-weight: 600; line-height: 1.1">7,412</span>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F432","options":["#C6F432","#4DD0E1","#FFFFFF"]},"$preview":{"width":390,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    var hr = [58, 57, 60, 64, 72, 88, 104, 118, 112, 96, 80, 72, 68, 66, 64, 70, 74, 68, 64, 62, 61, 63, 62, 62];
    var lo = 50, hi = 122, w = 212, h = 40;
    var pts = hr.map(function (v, i) {
      var x = Math.round((i / (hr.length - 1)) * (w - 4) * 10) / 10 + 2;
      var y = Math.round((h - 3 - ((v - lo) / (hi - lo)) * (h - 6)) * 10) / 10;
      return x + ' ' + y;
    });
    var line = 'M' + pts.join(' L');
    return {
      accent: this.props.accent ?? '#C6F432',
      spark: line,
      sparkFill: line + ' L' + (w - 2) + ' ' + h + ' L2 ' + h + ' Z'
    };
  }
}
</script>
