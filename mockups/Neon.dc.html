<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch face U: Neon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tilt+Neon&amp;family=Manrope:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#1a1a1a}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 390px; border-radius: 50%; background: #000000; overflow: hidden; font-family: 'Tilt Neon', sans-serif; color: #ffffff">
<svg width="390" height="390" viewBox="0 0 390 390" fill="none" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<circle cx="195" cy="195" r="178" stroke="#101a1d" stroke-width="3"></circle>
<path d="M195 17 A178 178 0 1 1 17.4 206.4" stroke="#4DE8FF" stroke-opacity="0.18" stroke-width="12" stroke-linecap="round"></path>
<path d="M195 17 A178 178 0 1 1 17.4 206.4" stroke="#4DE8FF" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"></path>
<path d="M195 17 A178 178 0 1 1 17.4 206.4" stroke="#D8FAFF" stroke-width="2" stroke-linecap="round"></path>
</svg>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 390px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Tilt Neon', 'Helvetica Neue', sans-serif">
<div style="font-size: 15px; letter-spacing: 3px; color: #D8FAFF; text-shadow: 0 0 4px #4DE8FF, 0 0 12px #4DE8FF">MON 05 OCT · 28°</div>
<div style="font-size: 104px; line-height: 1.05; color: {{accentCore}}; text-shadow: 0 0 4px {{accent}}, 0 0 14px {{accent}}, 0 0 32px {{accent}}">10:08</div>
<div style="display: flex; gap: 18px; font-size: 20px; color: {{accentCore}}; text-shadow: 0 0 4px {{accent}}, 0 0 12px {{accent}}">
<span>HR 62</span><span>BB 68</span><span>ST 24</span>
</div>
<div style="display: flex; gap: 18px; margin-top: 8px; font-size: 15px; color: #D8FAFF; text-shadow: 0 0 4px #4DE8FF, 0 0 10px #4DE8FF">
<span>7,412 steps</span><span>1,840 kcal</span>
</div>
<div style="display: flex; gap: 14px; margin-top: 6px; font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: #7a8a90">
<span>↑5:58 ↓17:52</span><span>BAT 82%</span><span>3 NOTIF</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#FF4D8D", "options": ["#FF4D8D", "#B266FF", "#4DFF88", "#FF8C3D", "#FFE04D"]}, "$preview": {"width": 390, "height": 390}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF4D8D';
    return {accent, accentCore: this.pale(accent)};
  }
  // Glow core: the accent blended 85% toward white (default pink keeps its exact #FFE3EE).
  pale(hex) {
    if (hex.toUpperCase() === '#FF4D8D') return '#FFE3EE';
    const n = parseInt(hex.slice(1), 16);
    const c = [16, 8, 0].map(s => Math.floor(((n >> s) & 255) + (255 - ((n >> s) & 255)) * 0.85));
    return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  }
}
</script>
</body>
</html>
